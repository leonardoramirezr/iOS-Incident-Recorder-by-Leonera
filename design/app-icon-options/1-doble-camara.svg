<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3C"/><stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <linearGradient id="bump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C2E"/><stop offset="1" stop-color="#1C1C1E"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#3B4C6B"/><stop offset="0.45" stop-color="#121826"/><stop offset="1" stop-color="#05070B"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D1D1D6"/><stop offset="1" stop-color="#6E6E73"/>
    </linearGradient>
    <radialGradient id="rec" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FF6B60"/><stop offset="1" stop-color="#E5261B"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="150" y="150" width="724" height="724" rx="200" fill="url(#bump)" stroke="#48484A" stroke-width="6"/>
  <!-- lente trasera (grande) -->
  <circle cx="430" cy="430" r="200" fill="url(#ring)"/>
  <circle cx="430" cy="430" r="178" fill="url(#glass)"/>
  <circle cx="430" cy="430" r="96" fill="#05070B" stroke="#25324A" stroke-width="10"/>
  <ellipse cx="370" cy="360" rx="44" ry="28" fill="#FFFFFF" opacity="0.22" transform="rotate(-35 370 360)"/>
  <!-- lente frontal (pequeña) -->
  <circle cx="690" cy="690" r="108" fill="url(#ring)"/>
  <circle cx="690" cy="690" r="92" fill="url(#glass)"/>
  <circle cx="690" cy="690" r="46" fill="#05070B" stroke="#25324A" stroke-width="6"/>
  <ellipse cx="660" cy="655" rx="22" ry="14" fill="#FFFFFF" opacity="0.22" transform="rotate(-35 660 655)"/>
  <!-- punto de grabación -->
  <circle cx="700" cy="330" r="62" fill="url(#rec)"/>
</svg>
